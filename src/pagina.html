<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La palestra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="src/campo.css">
<link rel="stylesheet" href="src/tablilla.css">
<link rel="stylesheet" href="src/banquillo.css">
<link rel="stylesheet" href="src/cartela.css">
<link rel="stylesheet" href="src/personajes.css">
<link rel="stylesheet" href="src/entrevistas.css">
<style>
  :root{
    --bg:#0F0C18; --panel:#171226; --panel-2:#1F1930; --line:#372E4E;
    --ink:#F2EDE2; --muted:#A79DB5;
    --oro:#E9B84E; --ambar:#E9B84E; --green:#9BD164;
    --izq:#E2725B; --der:#57B8D6;
    --lento:1;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;padding:16px 16px 40px}
  main{max-width:620px;margin:0 auto}
  .cab{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 14px;padding-bottom:10px;
    border-bottom:1px solid var(--line)}
  h1{font-family:'Oswald',sans-serif;font-weight:500;font-size:26px;letter-spacing:2px;text-transform:uppercase;margin:0;color:var(--oro)}
  .sub{margin:0;color:var(--muted);font-size:13px}
  .sub b{color:var(--ink);font-weight:400;letter-spacing:1px}
  .pie{margin:4px 0 12px;color:var(--muted);font-size:12px;text-align:right}
  .pie a{color:var(--muted)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
  .panel h2{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;font-size:11px;color:var(--muted);margin:0 0 10px;font-weight:500}
  .fila{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .fila button{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:44px;cursor:pointer;font-size:18px}
  .fila button:disabled{opacity:.4;cursor:default}
  .fila button.scan{background:var(--oro);color:#1A1206;border-color:var(--oro)}
  .paso-t{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);flex:1;text-align:right;white-space:nowrap}
  .que b{color:var(--ink)}
  .bq-lista{margin:6px 0 0;font-size:14px;color:var(--muted)}
  .bq-lista b.izq{color:var(--izq)} .bq-lista b.der{color:var(--der)}
  .panel[hidden]{display:none}
  /* ── la ruta ── */
  .ruta{border-color:rgba(233,184,78,.35)}
  .rt-cab{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .rt-cab h2{margin:0}
  .rt-titulo{font-family:'Oswald',sans-serif;font-size:20px;font-weight:500;letter-spacing:.5px;margin:0}
  .rt-d{margin:4px 0 8px;color:var(--muted);font-size:14px}
  .rt-d b{color:var(--ink)}
  .rt-puntos{display:flex;align-items:center;gap:6px}
  .rt-p{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--oro);background:transparent}
  .rt-p.hecho{background:var(--oro)}
  .rt-hito{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);margin-left:4px}
  .rt-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .rt-btns button, .ac button{font:inherit;font-family:'Oswald',sans-serif;letter-spacing:1px;text-transform:uppercase;font-size:13px;
    color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:44px;cursor:pointer}
  .rt-btns button.scan{background:var(--oro);color:#1A1206;border-color:var(--oro)}
  .rt-btns button[hidden]{display:none}
  /* ── el ejercicio, dentro de la tablilla ── */
  .tl-ej[hidden]{display:none}
  .tl-marca{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px}
  .tl-marca .fi{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .tl-marca .fi b{color:var(--ink)}
  .tl-resp{display:flex;gap:8px;align-items:stretch;margin:0 0 8px}
  .tl-resp input{flex:1;min-width:0;font:inherit;font-family:'Space Mono',monospace;font-size:17px;padding:10px 12px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--ink);min-height:44px}
  .tl-resp button, .tl-ver{font:inherit;font-family:'Oswald',sans-serif;letter-spacing:1px;text-transform:uppercase;font-size:13px;
    color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:44px;cursor:pointer}
  .tl-resp button.scan{background:#d7a646;border-color:#a67a1f;color:#241b36}
  .tl-ver{width:100%}
  .tablilla:has(.tl-ej:not([hidden])) .tl-cursor{display:none}
  /* ── el acta ── */
  .ac summary{cursor:pointer;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;font-size:11px;color:var(--muted)}
  .ac-resumen{margin:8px 0;font-size:14px;color:var(--muted)}
  .ac-resumen b{color:var(--ink)}
  .ac-f{display:flex;gap:8px;font-size:14px;padding:4px 0;border-top:1px solid var(--line)}
  .ac-f .ac-n{flex:1} .ac-f.floja .ac-n::after{content:" · floja";color:var(--ambar)}
  .ac-fila{display:flex;gap:8px;align-items:stretch;margin-top:8px}
  .ac-fila input{flex:1;min-width:0;font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
</style>
</head>
<body>
<main>
  <header class="cab">
    <h1>La palestra</h1>
    <p class="sub"><b>ἑλκυστίνδα</b> · el tira y afloja de los números enteros</p>
  </header>

  <section class="panel ruta" id="ruta" aria-label="La ruta">
    <div class="rt-cab"><h2 id="rtCab">Misión 1 de 6</h2><p class="rt-titulo" id="rtTitulo"></p></div>
    <p class="rt-d" id="rtTxt"></p>
    <div class="rt-puntos" id="rtPuntos"></div>
    <div class="rt-btns">
      <button type="button" id="rtSigue" class="scan" hidden>Siguiente misión</button>
      <button type="button" id="rtSalta">Saltar</button>
      <button type="button" id="rtLibre">Modo libre</button>
      <button type="button" id="rtEntrevista">Entrevistas</button>
    </div>
  </section>

  <section class="panel entrevista" id="entrevista" hidden aria-label="Entrevistas">
    <h2>Entrevistas en la palestra</h2>
    <div class="ev-quien" role="group" aria-label="A quién entrevistar"></div>
    <p class="ev-cartel"></p>
    <div class="ev-escena">
      <div class="ev-cara" aria-hidden="true"></div>
      <div class="ev-globo">
        <p class="ev-pregunta"></p>
        <p class="ev-respuesta" aria-live="polite"></p>
        <button type="button" class="ev-prueba" hidden>Verlo en la tablilla</button>
      </div>
    </div>
    <p class="ev-rotulo">Pregúntale:</p>
    <div class="ev-lista"></div>
    <div class="rt-btns"><button type="button" id="evSalir">Volver a la palestra</button></div>
  </section>

  <section class="tablilla" aria-label="La tablilla">
    <div class="tl-cab">
      <h2>La tablilla</h2>
      <span class="tl-placa" aria-label="Tabli-Cas-IO fi-ji 320 antes de Cristo, con teatro incorporado"><b>TABLI·CAS·IO <span class="tl-modelo">φχ-320 a. C.</span></b><i>con teatro incorporado · escriba: Listillón</i></span>
    </div>
    <div class="tl-tabla" aria-live="polite"><span id="tlEscrito"></span><span class="tl-cursor" aria-hidden="true"></span></div>
    <div class="tl-ej" id="tlEj" hidden>
      <p class="tl-marca" id="tlMarca"></p>
      <div class="tl-resp">
        <input id="tlResp" type="text" inputmode="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="¿Dónde acaba la bandera?" aria-label="Tu respuesta">
        <button type="button" id="tlComprueba" class="scan">Comprobar</button>
      </div>
      <button type="button" id="tlVer" class="tl-ver">▶ Verlo en el campo</button>
    </div>
    <div class="tl-teclas" id="tlTeclas"></div>
    <div class="habla"><span class="cara lis" aria-hidden="true"></span><p class="aviso tl-aviso" id="tlAviso" role="status"></p></div>
    <div class="tl-pie" id="tlPie">
      <button type="button" id="tlLimpia">Tablilla limpia</button>
      <button type="button" id="tlMuestra">Una de muestra</button>
      <button type="button" id="tlRuta">Volver a la ruta</button>
      <button type="button" id="tlEntrevista">Entrevistas</button>
    </div>
  </section>

  <section class="panel" id="panelCampo" hidden aria-label="El campo">
    <h2>Tira y afloja</h2>
    <div class="cartela" id="cartela" role="status" hidden></div>
    <div class="banquillo" id="banquillo" hidden><span class="bq-t">banquillo</span><div class="bq-sitio"></div><div class="bq-banco"></div></div>
    <div id="campo"></div>
    <div class="fila">
      <button type="button" id="atras" aria-label="Atrás">◀</button>
      <button type="button" id="sig" class="scan" aria-label="Adelante">▶</button>
      <button type="button" id="inicio" aria-label="Volver al principio">⟲</button>
      <button type="button" id="todo" aria-label="Repasar de un tirón" hidden>▶▶</button>
      <span class="paso-t" id="pasoT"></span>
    </div>
    <div class="habla jef"><span class="cara jef" aria-hidden="true"></span><p class="aviso" id="jefAviso" role="status"></p></div>
  </section>

  <p class="pie">prototipo 0.10 · <a href="https://github.com/diazepamina-creator/la-palestra">la-palestra</a></p>
  <details class="panel ac" id="acta">
    <summary>Acta de la jornada</summary>
    <p class="ac-resumen" id="acResumen"></p>
    <div id="acFilas"></div>
    <div class="ac-fila"><input id="acNombre" type="text" placeholder="Nombre" aria-label="Nombre"><button type="button" id="acCopia">Copiar acta</button></div>
  </details>
</main>
<script src="src/motor.js"></script>
<script src="src/tirador.js"></script>
<script src="src/campo.js"></script>
<script src="src/tablilla.js"></script>
<script src="src/reproductor.js"></script>
<script src="src/personajes.js"></script>
<script src="src/zeus.js"></script>
<script src="src/ejercicios.js"></script>
<script src="src/entrevistas.js"></script>
<script>
  const P = window.Palestra, C = window.Campo, TL = window.Tablilla, PJ = window.Personajes, E = window.Ejercicios;
  const $ = id => document.getElementById(id);
  const n = f => ({t:'n', f}), mas = {t:'+'}, menos = {t:'-'}, ab = {t:'('}, ci = {t:')'};
  const po = k => ({t:'p', k, pre:false}), pre = k => ({t:'p', k, pre:true}), e = x => ({t:'e', n:x});
  const MUESTRAS = [
    [n(-2), mas, n(5)], [n(2), menos, n(5)], [n(2), mas, n(4), po(-2)], [n(3), menos, n(-4), po(-2)],
    [n(-2), mas, pre(3), ab, n(-2), mas, n(1), ci], [pre(-1), ab, n(-2), mas, n(-3), mas, n(-1), ci],
    [n(4), menos, ab, n(3), menos, n(5), ci], [n(-3), e(2)], [n(5), mas, n(4), menos, n(3), menos, n(-1), menos, n(-2)]
  ];
  let muestra = 0;

  /* ── el estado de la página: la cuenta escrita y, si se ha pulsado =, su película ── */
  const S = {tok: [], pel: null, visto: false, ej: null};
  /* la ruta y el acta; si hay un turno guardado de esta clase, se retoma */
  let ruta = E.nuevaRuta(), sesion = E.nuevaSesion();
  { const d = E.lee(); if(d){ ruta = d.ruta; sesion = d.sesion; } }

  const campo = C.monta($('campo'));
  const R = window.Reproductor.crea({campo, banquillo: $('banquillo'), alCambiar: pintaMandos});
  C.alTocarRegla(campo, v => R.elige(v));
  TL.monta($('tlTeclas'), tecla);

  function tecla(tk){
    if(S.ej) return;                         // en los ejercicios no se escribe
    if(tk.t === '='){ igual(); return; }
    const r = TL.pulsa(S.tok, tk);
    S.tok = r.tok; S.pel = null; S.visto = false; R.para();
    $('tlAviso').innerHTML = r.aviso;
    pintaTablilla();
    $('panelCampo').hidden = true;
  }
  function igual(){
    if(!S.tok.length){ $('tlAviso').innerHTML = 'Todavía no has escrito nada.'; return; }
    try{ S.pel = P.graba(S.tok); }
    catch(err){ $('tlAviso').innerHTML = err.message; return; }
    S.visto = false;
    if(S.ej && S.ej.fase !== 'bien') S.ej.visto = true;
    if(S.pel.sinTeatro){
      $('tlAviso').innerHTML = S.pel.sinTeatro + ' Así que esta va <b>sin teatro</b>: te la calculo igual.';
      $('panelCampo').hidden = true;
    }else{
      $('tlAviso').innerHTML = 'Pulsa <b>▶</b> para verla en el campo, paso a paso.';
      $('panelCampo').hidden = false;
      $('panelCampo').scrollIntoView({behavior: 'smooth', block: 'start'});
    }
    pintaTablilla();
    if(!S.pel.sinTeatro) R.carga(S.pel);
  }

  /* ── LA RUTA Y LOS EJERCICIOS ── */
  function pintaRuta(){
    const m = E.MISIONES[ruta.i];
    $('rtCab').textContent = 'Misión ' + (ruta.i + 1) + ' de ' + E.MISIONES.length;
    $('rtTitulo').textContent = m.t;
    $('rtTxt').innerHTML = (ruta.hecho ? '<b>Misión cumplida.</b> ' : '') + m.d;
    let p = '';
    for(let k = 0; k < m.meta; k++) p += '<span class="rt-p' + (k < ruta.hechas ? ' hecho' : '') + '"></span>';
    $('rtPuntos').innerHTML = p + '<span class="rt-hito">' + ruta.hechas + ' de ' + m.meta + '</span>';
    $('rtSigue').hidden = !(ruta.hecho && ruta.i < E.MISIONES.length - 1);
    $('rtSalta').hidden = ruta.hecho || ruta.i >= E.MISIONES.length - 1;
  }
  function ronda(){
    const m = E.MISIONES[ruta.i];
    const ej = E.genera(m.nivel);
    S.ej = {valor: ej.valor, visto: false, fase: 'pensando'};
    S.tok = ej.tok; S.pel = null; S.visto = false; R.para();
    $('tlResp').value = '';
    $('tlAviso').innerHTML = '';
    $('panelCampo').hidden = true;
    pintaTablilla(); pintaMarca();
  }
  function pintaMarca(){
    const m = sesion.mision[ruta.i] || {bien: 0, mal: 0};
    $('tlMarca').innerHTML = '<span class="fi">resueltas <b>' + m.bien + '</b></span>' +
      '<span class="fi">sin mirar <b>' + (sesion.solas && sesion.solas[ruta.i] || 0) + '</b></span>';
  }
  const esEntero = t => /^[-+]?\d+$/.test(String(t).replace(/[−–]/g, '-').replace(/\s+/g, ''));
  function comprueba(){
    if(!S.ej || S.ej.fase === 'bien') return;
    const resp = String($('tlResp').value).trim();
    if(!resp) return;
    if(!esEntero(resp)){ $('tlAviso').innerHTML = 'Escribe un número: con cifras, y el signo delante si lo lleva.'; return; }
    const dicho = parseInt(resp.replace(/[−–]/g, '-'), 10);
    if(dicho === S.ej.valor){
      S.ej.fase = 'bien';
      E.anota(sesion, ruta, true);
      if(!S.ej.visto){ sesion.solas = sesion.solas || {}; sesion.solas[ruta.i] = (sesion.solas[ruta.i] || 0) + 1; }
      const cumplida = E.acierta(ruta);
      $('tlAviso').innerHTML = '<b>¡Correcto!</b>' + (S.ej.visto ? '' : ' Y sin mirar.') + (cumplida ? ' <b>Misión cumplida.</b>' : '');
      E.guarda(ruta, sesion);
      pintaRuta(); pintaMarca(); pintaActa();
      const yo = S.ej;
      setTimeout(() => { if(S.ej === yo) ronda(); }, 2000);
    }else{
      E.anota(sesion, ruta, false);
      E.guarda(ruta, sesion);
      $('tlAviso').innerHTML = 'No es <b>' + resp.replace('-', '−') + '</b>. Pulsa <b>▶ Verlo en el campo</b> y mira dónde acaba.';
      $('tlResp').value = '';
      pintaMarca(); pintaActa();
    }
  }
  function modoRuta(si){
    $('ruta').hidden = !si;
    $('tlEj').hidden = !si;
    $('tlTeclas').hidden = si;
    $('tlPie').hidden = si;
    $('tlRuta').hidden = false;
    if(si){ pintaRuta(); ronda(); }
    else{ S.ej = null; S.tok = []; S.pel = null; R.para(); $('tlAviso').innerHTML = 'Escribe una cuenta y pulsa <b>=</b>.'; pintaTablilla(); $('panelCampo').hidden = true; }
  }
  function pintaActa(){
    const total = sesion.bien + sesion.mal;
    $('acResumen').innerHTML = '<b>' + sesion.bien + '</b> resueltas · <b>' + sesion.mal + '</b> falladas · ' +
      (total ? Math.round(100 * sesion.bien / total) : 0) + '% de acierto · tiempo: <b>' + E.reloj(Date.now() - sesion.t0) + '</b>';
    $('acFilas').innerHTML = Object.keys(sesion.mision).sort((a, b) => a - b).map(i => {
      const m = sesion.mision[i], t = m.bien + m.mal;
      return '<div class="ac-f' + (m.mal > m.bien ? ' floja' : '') + '"><span class="ac-n">' + (Number(i) + 1) + '. ' + E.MISIONES[i].t + '</span><span>' + m.bien + ' de ' + t + '</span></div>';
    }).join('') || '<div class="ac-f"><span class="ac-n">Aún no hay nada anotado.</span></div>';
    $('acNombre').value = sesion.nombre || '';
  }
  $('tlComprueba').addEventListener('click', comprueba);
  $('tlResp').addEventListener('keydown', ev => { if(ev.key === 'Enter'){ ev.preventDefault(); comprueba(); } });
  $('tlVer').addEventListener('click', () => { if(S.ej) igual(); });
  $('rtSigue').addEventListener('click', () => { if(E.siguiente(ruta)){ E.guarda(ruta, sesion); pintaRuta(); ronda(); } });
  $('rtSalta').addEventListener('click', () => { if(E.siguiente(ruta)){ E.guarda(ruta, sesion); pintaRuta(); ronda(); } });
  $('rtLibre').addEventListener('click', () => modoRuta(false));
  $('tlRuta').addEventListener('click', () => modoRuta(true));
  $('acNombre').addEventListener('input', () => { sesion.nombre = $('acNombre').value; E.guarda(ruta, sesion); });
  $('acCopia').addEventListener('click', () => {
    const t = E.actaEnTexto(sesion);
    const listo = () => { $('acCopia').textContent = 'Copiada'; setTimeout(() => { $('acCopia').textContent = 'Copiar acta'; }, 1500); };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(listo, () => alert(t));
    else alert(t);
  });
  $('acta').addEventListener('toggle', pintaActa);
  function pintaTablilla(){
    let h = TL.htmlCuenta(S.tok);
    if(S.pel){
      const fin = S.pel.sinTeatro || (R.pel === S.pel && R.k === S.pel.pasos.length);
      if(fin) h += '<span class="op"> = </span><b class="tl-res' + (S.pel.exacto[1] !== 1 ? ' frac' : '') + '">' + P.fracTxt(S.pel.exacto) + '</b>';
    }
    $('tlEscrito').innerHTML = h || '<span class="tl-vacia">escribe aquí…</span>';
  }
  /* la cartela: la cuenta con el trozo que se juega iluminado, y debajo qué pasa */
  function cartela(R){
    const c = $('cartela'), pel = R.pel, k = R.k, n = pel.pasos.length;
    const hechos = new Set();
    pel.pasos.slice(0, Math.max(0, k - 1)).forEach(p => p.m.forEach(i => hechos.add(i)));
    let on = new Set(), x = '', clase = '';
    if(R.pregunta){
      on = new Set(pel.pasos[R.pregunta - 1].m);
      x = '¿dónde acabará? <b>toca la regla</b>'; clase = 'pregunta';
    }else if(k === 0){
      const esperan = pel.tok.some(t => t.t === 'p' && t.pre);
      x = esperan ? 'la poción espera en el banquillo' : 'pulsa ▶';
    }else{
      const paso = pel.pasos[k - 1];
      on = new Set(paso.m); x = paso.x;
      if(R.veredicto){
        const v = R.veredicto;
        x += (x ? '<br>' : '') + (v.clavado ? '<b class="clavado">¡clavado!</b>'
          : 'dijiste ' + P.conSigno(v.dicho) + ', acaba en <b>' + P.conSigno(v.real) + '</b>');
      }
    }
    const fin = k === n && !R.jugando;
    c.innerHTML = '<span class="ct-cuenta">' + TL.htmlCuenta(pel.tok, i => on.has(i) ? 'ct-on' : (hechos.has(i) && !fin ? 'ct-hecho' : '')) +
      (fin ? ' <span class="op">=</span> <b class="ct-res">' + P.fracTxt(pel.exacto) + '</b>' : '') + '</span>' +
      (x ? '<small class="ct-x ' + clase + '">' + x + '</small>' : '');
    c.hidden = false;
    c.classList.remove('nueva'); void c.offsetWidth; c.classList.add('nueva');
  }
  /* Jeferión comenta el veredicto y el final de la función */
  function jeferion(R){
    const k = R.k, n = R.pel.pasos.length;
    let h = '';
    if(R.veredicto){
      const v = R.veredicto;
      h = v.clavado ? '<b>¡Clavado!</b> Así se gana un pulso.'
        : 'Dijiste <b>' + P.conSigno(v.dicho) + '</b> y acaba en <b>' + P.conSigno(v.real) + '</b>. Mira hacia dónde tira cada uno.';
    }else if(k === n && !R.jugando) h = 'La cuenta vale <b>' + P.fracTxt(R.pel.exacto) + '</b>.';
    $('jefAviso').innerHTML = h;
  }
  /* los mandos, cada vez que el reproductor cambia */
  function pintaMandos(R){
    if(!R.pel) return;
    const k = R.k, foto = k ? R.pel.pasos[k - 1] : null;
    cartela(R);
    jeferion(R);
    $('pasoT').textContent = 'fotograma ' + k + ' de ' + R.pel.pasos.length;
    $('atras').disabled = k === 0 || R.jugando;
    $('sig').disabled = k >= R.pel.pasos.length || R.jugando;
    $('inicio').disabled = R.jugando;
    if(k === R.pel.pasos.length) S.visto = true;
    $('todo').hidden = !S.visto;
    $('todo').disabled = R.jugando;
    pintaTablilla();
  }
  $('sig').addEventListener('click', () => R.avanza());
  $('atras').addEventListener('click', () => R.retrocede());
  $('inicio').addEventListener('click', () => R.principio());
  $('todo').addEventListener('click', () => R.repasa());
  $('tlLimpia').addEventListener('click', () => { S.tok = []; S.pel = null; R.para(); $('tlAviso').innerHTML = 'Tablilla limpia.'; pintaTablilla(); $('panelCampo').hidden = true; });
  $('tlMuestra').addEventListener('click', () => { S.tok = MUESTRAS[muestra++ % MUESTRAS.length].slice(); S.pel = null; R.para(); $('tlAviso').innerHTML = ''; pintaTablilla(); $('panelCampo').hidden = true; });
  document.addEventListener('keydown', ev => {
    if(ev.target && /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)) return;
    if(S.pel && !S.pel.sinTeatro && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft')){
      ev.preventDefault(); if(ev.key === 'ArrowRight') R.avanza(); else R.retrocede(); return;
    }
    const tk = TL.teclaDeTeclado(ev);
    if(tk){ ev.preventDefault(); tecla(tk); }
  });
  window.addEventListener('resize', () => { if(R.pel && !R.jugando) R.muestra(R.k); });
  /* las caras: cada aviso nuevo pone la pose que le va y mueve el pico */
  document.querySelectorAll('.cara.jef').forEach(c => PJ.ponCara(c, 'jef', 'habla'));
  document.querySelectorAll('.cara.lis').forEach(c => PJ.ponCara(c, 'lis', 'habla'));
  document.querySelectorAll('.habla').forEach(h => {
    const av = h.querySelector('.aviso'), c = h.querySelector('.cara');
    const quien = c.classList.contains('jef') ? 'jef' : 'lis';
    new MutationObserver(() => { const p = PJ.poseDeTexto(av.innerHTML); if(p) PJ.ponCara(c, quien, p, true); })
      .observe(av, {childList: true, subtree: true, characterData: true});
  });
  /* ── LAS ENTREVISTAS ── */
  let enRuta = true;
  const EV = window.Entrevistas.monta($('entrevista'), {alPrueba: tok => {
    entrevista(false);
    modoRuta(false);
    S.tok = tok; pintaTablilla(); igual();
  }});
  function entrevista(si){
    $('entrevista').hidden = !si;
    document.querySelector('.tablilla').hidden = si;
    if(si){ enRuta = !$('ruta').hidden; $('ruta').hidden = true; $('panelCampo').hidden = true; $('acta').hidden = true; EV.abre(); window.scrollTo({top: 0, behavior: 'smooth'}); }
    else{ EV.calla(); $('acta').hidden = false; $('ruta').hidden = !enRuta; }
  }
  $('rtEntrevista').addEventListener('click', () => entrevista(true));
  $('tlEntrevista').addEventListener('click', () => entrevista(true));
  $('evSalir').addEventListener('click', () => entrevista(false));

  pintaTablilla();
  modoRuta(true);
  pintaActa();
</script>
</body>
</html>
