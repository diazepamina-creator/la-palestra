<script>
/* ══════════════════════════════════════════════════════════════════════
   LA PALESTRA · el motor
   El estado del campo, la cuenta escrita en la tablilla, el intérprete que
   la juega y el grabador que la convierte en fotogramas. Aquí no se dibuja
   nada: todo lo de la pantalla vive aparte y lee lo que sale de aquí.

   Las reglas que manda todo esto:
   · Lo que tira en la cuerda es lo que suma. La bandera nunca se congela.
   · Un término compuesto se prepara en el banquillo y sale a tirar hecho.
       nivel 1: un jugador solo (4·(−2), (−3)², −(−4)·(−2))
       nivel 2: un paréntesis de sumas: se reduce a uno y luego bebe
       nivel 3 o más: sin teatro; la cuenta se hace exacta, con fracciones
   · El signo va dentro del tirador; + y − son «que entre» y «que se retire».
   ══════════════════════════════════════════════════════════════════════ */
(function (raiz) {
'use strict';

const MAX_F = 12;      // fuerza máxima de un tirador en la palestra
const TOPE_LADO = 5;   // en cada lado tiran cinco como mucho

const POCIONES = [
  {k: 2,    e: '·2',    n: 'Doblón',          d: 'tira el doble'},
  {k: 3,    e: '·3',    n: 'Triplón',         d: 'tira el triple'},
  {k: 1/2,  e: ':2',    n: 'Aguada',          d: 'se queda en la mitad'},
  {k: 1/3,  e: ':3',    n: 'Aguachirle',      d: 'se queda en un tercio'},
  {k: -1,   e: '·(−1)', n: 'Traición',        d: 'misma fuerza, otro bando'},
  {k: -2,   e: '·(−2)', n: 'Traición doble',  d: 'el doble de fuerza, y en contra'},
  {k: -3,   e: '·(−3)', n: 'Traición triple', d: 'el triple de fuerza, y en contra'},
  {k: -1/2, e: ':(−2)', n: 'Traición aguada', d: 'la mitad de fuerza, y en contra'}
];
const pocionDe = k => POCIONES.find(p => Math.abs(p.k - k) < 1e-9) || null;

/* ── cómo se escriben los números ── */
const conSigno = n => n === 0 ? '0' : (n > 0 ? '+' : '−') + Math.abs(n);
/* como en el cuaderno: el primero sin paréntesis, los negativos de después
   entre paréntesis y los positivos sin signo */
const numCuaderno = (f, primero) => primero ? (f < 0 ? conSigno(f) : String(f))
  : (f < 0 ? '(' + conSigno(f) + ')' : String(f));
const etqDe = k => { const po = pocionDe(k); return po ? po.e : '·' + k; };
const preTxt = k => (k < 0 ? '(' + conSigno(k) + ')' : String(k)) + '·';

class ErrorPalestra extends Error {
  constructor(msg, tipo){ super(msg); this.tipo = tipo || 'campo'; }
}

/* ══════════════════════════════════════════════════════════════════════
   EL CAMPO: la cuerda y el banquillo. Un solo objeto con todo el estado.
   Cada tirador: {id, f, venia}. «venia» guarda de qué bando venía quien
   cambió de bando con una traición: sale con los pantalones de antes.
   ══════════════════════════════════════════════════════════════════════ */
class Campo {
  constructor(){ this.cuerda = []; this.banquillo = []; this.sig = 1; }
  suma(){ return this.cuerda.reduce((a, p) => a + p.f, 0); }
  busca(id){ return this.cuerda.find(p => p.id === id) || this.banquillo.find(p => p.id === id) || null; }
  enBanquillo(id){ return this.banquillo.some(p => p.id === id); }
  foto(){
    const copia = l => l.map(p => ({id: p.id, f: p.f, venia: p.venia || null}));
    return {cuerda: copia(this.cuerda), banquillo: copia(this.banquillo), bandera: this.suma()};
  }
  /* la cuerda tiene sus límites; el banquillo no */
  comprueba(){
    const izq = this.cuerda.filter(p => p.f < 0).length, der = this.cuerda.length - izq;
    if(izq > TOPE_LADO || der > TOPE_LADO)
      throw new ErrorPalestra('No caben: en cada lado tiran cinco como mucho, y aquí serían ' + Math.max(izq, der) + '.');
    const s = this.suma();
    if(Math.abs(s) > MAX_F)
      throw new ErrorPalestra('La bandera se saldría de la regla, que llega hasta ±' + MAX_F + ': acabaría en ' + conSigno(s) + '.');
  }
  entra(f, alBanquillo){
    const p = {id: this.sig++, f, venia: null};
    (alBanquillo ? this.banquillo : this.cuerda).push(p);
    if(!alBanquillo) this.comprueba();
    return p.id;
  }
  retira(id){
    const p = this.busca(id);
    if(!p) throw new ErrorPalestra('No hay nadie con ese número a quien retirar.');
    this.cuerda = this.cuerda.filter(q => q.id !== id);
    this.banquillo = this.banquillo.filter(q => q.id !== id);
  }
  /* beber: la fuerza se multiplica; si cambia de signo, cambia de bando */
  bebe(id, k){
    const p = this.busca(id);
    if(!p) return;
    const v = p.f * k;
    if(!Number.isInteger(v))
      throw new ErrorPalestra('El de ' + conSigno(p.f) + ' no se puede repartir así: le tocaría ' +
        String(Math.round(v * 100) / 100).replace('.', ',') + ', y aquí se tira con fuerzas enteras.');
    if(Math.abs(v) > MAX_F)
      throw new ErrorPalestra('Un tirador de fuerza ' + Math.abs(v) + ' no cabe en la palestra: como mucho ' + MAX_F + '.');
    if((p.f < 0) !== (v < 0) && v !== 0) p.venia = p.venia || (p.f < 0 ? 'izq' : 'der');
    p.f = v;
    if(!this.enBanquillo(id)) this.comprueba();
  }
  /* varios se juntan en uno que vale su suma (0: no queda nadie) */
  junta(ids){
    if(!ids.length) return null;
    const enBanco = this.enBanquillo(ids[0]);
    const lista = enBanco ? this.banquillo : this.cuerda;
    const s = ids.reduce((a, id) => a + ((lista.find(p => p.id === id) || {f: 0}).f), 0);
    const resto = lista.filter(p => ids.indexOf(p.id) < 0);
    let nuevo = null;
    if(s){ nuevo = {id: this.sig++, f: s, venia: null}; resto.push(nuevo); }
    if(enBanco) this.banquillo = resto; else this.cuerda = resto;
    if(!enBanco) this.comprueba();
    return nuevo ? nuevo.id : null;
  }
  /* del banquillo a la cuerda, ya hecho */
  sale(ids){
    ids.forEach(id => {
      const p = this.banquillo.find(q => q.id === id);
      if(!p) return;
      this.banquillo = this.banquillo.filter(q => q.id !== id);
      this.cuerda.push(p);
    });
    this.comprueba();
  }
}

/* ══════════════════════════════════════════════════════════════════════
   LA CUENTA. Piezas de la tablilla:
     {t:'n', f}          un tirador con su signo
     {t:'+'} {t:'-'}     que entre, que se retire
     {t:'('} {t:')'}
     {t:'p', k, pre}     una poción: delante (3·) o detrás (·3)
     {t:'e', n}          al cuadrado (2) o al cubo (3)
   El analizador la convierte en un árbol:
     expr  = {terms:[term]}
     term  = {sign, si, pre:[{k, ti}], factor, exp, ei, post:[k], postI:[i]}
     factor= {t:'n', f, a, z} | {t:'g', expr, a, z}
   Las letras a, z, si, ti, ei, postI son posiciones en la tablilla: con
   ellas la cartela ilumina el trozo que se está jugando.
   ══════════════════════════════════════════════════════════════════════ */
function analiza(T){
  let i = 0;
  const err = m => { throw new ErrorPalestra(m, 'cuenta'); };
  function expr(){
    const terms = [];
    let sign = '+', si = null;
    if(T[i] && T[i].t === '-'){ sign = '-'; si = i; i++; }
    for(;;){
      terms.push(Object.assign({sign, si}, term()));
      if(T[i] && (T[i].t === '+' || T[i].t === '-')){ sign = T[i].t; si = i; i++; continue; }
      break;
    }
    return {terms};
  }
  function term(){
    const pre = [], post = [], postI = [];
    while(T[i] && T[i].t === 'p' && T[i].pre){ pre.push({k: T[i].k, ti: i}); i++; }
    let factor;
    if(!T[i]) err('La cuenta se ha quedado a medias: falta a quién darle el frasco o el número de detrás.');
    if(T[i].t === 'n'){ factor = {t: 'n', f: T[i].f, a: i, z: i}; i++; }
    else if(T[i].t === '('){
      const a = i; i++;
      const dentro = expr();
      if(!T[i] || T[i].t !== ')') err('Falta cerrar un paréntesis.');
      factor = {t: 'g', expr: dentro, a, z: i}; i++;
    }else err('Ahí falta un tirador o un paréntesis.');
    let exp = 1, ei = null;
    if(T[i] && T[i].t === 'e'){ exp = T[i].n; ei = i; i++; }
    while(T[i] && T[i].t === 'p' && !T[i].pre){ post.push(T[i].k); postI.push(i); i++; }
    return {pre, factor, exp, ei, post, postI};
  }
  if(!T || !T.length) err('Todavía no has escrito nada.');
  const e = expr();

/* la cuenta escrita, en texto plano (la pantalla la colorea aparte) */
const SUP = {2: '²', 3: '³'};
function escribe(e, primero){
  let h = '';

    if(t.sign === '-') h += (n === 0 ? '−' : ' − ');
    else if(n > 0) h += ' + ';
    const ini = (primero === undefined || primero) && n === 0 && t.sign === '+';
    t.pre.forEach(p => { h += preTxt(p.k); });
    h += t.factor.t === 'n' ? numCuaderno(t.factor.f, ini && !t.pre.length && !(t.exp > 1 && t.factor.f < 0))

    if(t.exp > 1) h += SUP[t.exp] || '^' + t.exp;
    t.post.forEach(k => { h += etqDe(k); });

/* ── la cuenta hecha a mano, en fracciones exactas: para lo que no cabe ── */
const mcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while(b){ [a, b] = [b, a % b]; } return a || 1; };

  e.terms.forEach(t => {
    let v = t.factor.t === 'n' ? [t.factor.f, 1] : exacto(t.factor.expr);
    if(t.exp > 1) v = [Math.pow(v[0], t.exp), Math.pow(v[1], t.exp)];
    t.pre.map(p => p.k).concat(t.post).forEach(k => { const f = fracDe(k); v = frac(v[0] * f[0], v[1] * f[1]); });
    if(t.sign === '-') v = [-v[0], v[1]];
    tot = frac(tot[0] * v[1] + v[0] * tot[1], tot[1] * v[1]);
  });

/* ══════════════════════════════════════════════════════════════════════
   EL INTÉRPRETE. Juega el árbol sobre un campo y va contando cada paso
   a «cuenta(paso)». Un paso es {tipo, m, x}: qué ha pasado, qué trozo de la
   tablilla se ilumina (posiciones) y la cuenta pequeña en palabras.
   ══════════════════════════════════════════════════════════════════════ */

  t.postI.length ? t.postI[t.postI.length - 1] : (t.ei !== null && t.ei !== undefined ? t.ei : t.factor.z)));

        }else{

          di('pareja', conSi(t, [t.factor.a]), 'no hay ' + conSigno(f) + ': entran ' + conSigno(f) + ' y ' + conSigno(-f) + ' (suman 0)');

    const beben = (k, m) => ids.forEach(id => { const f0 = campo.busca(id).f; campo.bebe(id, k); di('bebe', m, cuentaBebe(f0, k)); });
    /* primero los frascos de delante (el más cercano antes), luego los de detrás */
    t.pre.slice().reverse().forEach(p => beben(p.k, [p.ti].concat(trozoFactor(t))));

   EL GRABADOR. Juega la cuenta entera de una vez y guarda una foto del
   campo tras cada paso: la película. Quien la reproduce solo tiene que

    pel.pasos = [];

    pel.sinTeatro = e.message;
  }

<script>
/* ══════════════════════════════════════════════════════════════════════
   LA PALESTRA · el campo
   Dibuja una foto del motor: la cuerda con sus equipos, la regla y la
   bandera. No sabe nada de la cuenta ni de los pasos: le das una foto
   {cuerda, banquillo, bandera} y la pinta. Sin animación: eso es del
   reproductor, que vendrá después.
   ══════════════════════════════════════════════════════════════════════ */
(function (raiz) {
'use strict';
const T = raiz.Tirador;

const PLANTILLA =
  '<div class="escena">' +
    '<div class="friso" aria-hidden="true"></div>' +
    '<div class="columnata" aria-hidden="true"></div>' +
    '<div class="equipo izq"></div>' +
    '<div class="equipo der"></div>' +
    '<div class="marca"></div>' +
    '<div class="cuerda"></div>' +
    '<svg class="cuerdaFloja" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">' +
      '<defs><linearGradient id="gFloja" gradientUnits="userSpaceOnUse" x1="0" y1="17" x2="0" y2="24">' +
      '<stop offset="0" stop-color="#c2a86a"/><stop offset=".55" stop-color="#8a7442"/>' +
      '<stop offset="1" stop-color="#5e4e2c"/></linearGradient></defs>' +
      '<path d="M0 20.5 Q50 28.5 100 20.5"/></svg>' +
    '<div class="regla"></div>' +
    '<div class="nudo sin"><span class="tela"></span><span class="cifra">?</span></div>' +
  '</div>';

const PANDEO = 4;   // cuánto cuelga la bandera cuando nadie tira

/* prepara el campo dentro de un elemento vacío */
function monta(el){
  el.classList.add('campo');
  el.innerHTML = PLANTILLA;
  return el;
}

/* cuánto mide un paso de la regla para que quepa entera */
function pasoQueCabe(ancho, alcance){
  const p = Math.floor((ancho / 2 - 16) / (alcance + 1.4));
  return Math.max(15, Math.min(24, p));
}

function pintaRegla(regla, alcance, paso, bandera, hayGente, opciones){
  let h = '';
  for(let v = -alcance; v <= alcance; v++){
    const clase = (v === 0 ? ' cero' : '') + (hayGente && v === bandera ? ' aqui' : '') +
      (opciones.pin === v ? ' pronostico' : '') + (v % 2 === 0 ? ' par' : ' impar');
    h += '<span class="marca-n' + clase + '" data-v="' + v + '" style="left:calc(50% + ' + (v * paso) + 'px)"><i></i>' + v + '</span>';
  }
  regla.innerHTML = h;
  regla.style.setProperty('--paso', paso + 'px');
  regla.classList.toggle('ancha', paso >= 19);
  regla.classList.toggle('estrecha', paso < 18 || alcance > 8);
  /* «viva»: se puede tocar para decir dónde acabará la bandera */
  regla.classList.toggle('viva', !!opciones.viva);
}

/* pinta la foto. opciones: {alcance} para que la regla no cambie de tamaño
   a mitad de una película; {nuevos: [ids]} los que acaban de llegar;
   {viva} la regla se puede tocar; {pin} el número que dijo el alumno */
function pinta(el, foto, opciones){
  opciones = opciones || {};
  const cuerda = foto.cuerda || [], bandera = foto.bandera || 0;
  const alcance = Math.max(8, Math.min(12, opciones.alcance || Math.ceil(Math.abs(bandera))));
  const anchoCampo = el.clientWidth || 470;
  const paso = pasoQueCabe(anchoCampo, alcance);
  const hayGente = cuerda.length > 0;

  /* los tiradores: cuanta más fuerza, más grandes, y con la misma escala
     para todos los que están en el campo */
  const maxF = Math.max(1, ...cuerda.map(p => Math.abs(p.f)));
  const U = Math.min(27, 104 / (1 + 0.34 * Math.log(maxF)));
  const izq = el.querySelector('.equipo.izq'), der = el.querySelector('.equipo.der');
  izq.innerHTML = ''; der.innerHTML = '';
  const nuevos = opciones.nuevos || [];
  cuerda.forEach(p => {
    const d = document.createElement('div');
    d.className = 'tirador ' + (p.f < 0 ? 'izq' : 'der') + (p.venia ? ' venia-' + p.venia : '') +
      (Math.abs(p.f) === maxF && maxF > 1 ? ' laureado' : '') + (nuevos.indexOf(p.id) >= 0 ? ' nuevo' : '');
    d.dataset.id = p.id;
    d.setAttribute('aria-label', 'Tirador de fuerza ' + Math.abs(p.f) + ' del lado ' + (p.f < 0 ? 'izquierdo' : 'derecho'));
    d.innerHTML = T.dibujaTirador(p, U);
    (p.f < 0 ? izq : der).appendChild(d);
  });

  /* la bandera se desplaza con la suma; los equipos, con ella */
  const arrastre = hayGente ? Math.max(-alcance * paso, Math.min(alcance * paso, bandera * paso)) : 0;
  el.style.setProperty('--arrastre', arrastre + 'px');

  /* la cámara: si los equipos no caben, la escena entera se encoge */
  const anchoDe = f => T.medidasDe(Math.abs(f), U).w + 3;
  const anchoLado = neg => cuerda.filter(p => (p.f < 0) === neg).reduce((a, p) => a + anchoDe(p.f), 0);
  const bordeIzq = Math.min(-anchoLado(true) + arrastre, -(alcance + 1.4) * paso);
  const bordeDer = Math.max(anchoLado(false) + arrastre, (alcance + 1.4) * paso);
  const zoom = Math.max(0.45, Math.floor(Math.min(1, anchoCampo / (bordeDer - bordeIzq + 26)) * 20) / 20);
  const pan = Math.round((-(bordeIzq + bordeDer) / 2) * zoom / 4) * 4;
  const esc = el.querySelector('.escena');
  esc.style.width = (100 / zoom).toFixed(2) + '%';
  esc.style.transform = 'translateX(calc(-50% + ' + pan + 'px)) scale(' + zoom.toFixed(3) + ')';
  [izq, der].forEach(e => {
    e.style.transform = 'translateX(var(--arrastre,0px))';
    e.style.transformOrigin = (e === izq ? 'right' : 'left') + ' bottom';
  });

  const nudo = el.querySelector('.nudo');
  nudo.style.transform = 'translate(' + arrastre + 'px, ' + (hayGente ? 0 : PANDEO) + 'px)';
  nudo.classList.toggle('sin', !hayGente);
  nudo.classList.toggle('haciaIzq', hayGente && bandera < 0);
  nudo.querySelector('.cifra').textContent = bandera === 0 ? '0' : T.conSigno(bandera);
  el.classList.toggle('tensa', hayGente);

  return {paso, zoom, alcance};
}

function alTocarRegla(el, fn){

    const m = ev.target.closest('.marca-n');
    if(m && el.querySelector('.regla').classList.contains('viva')) fn(parseInt(m.dataset.v, 10));
  });

<script>
/* ══════════════════════════════════════════════════════════════════════
   LA PALESTRA · la tablilla
   Donde se escribe la cuenta con teclas de barro: tiradores con su signo,
   pociones, + y − como acciones, paréntesis y potencias. Sabe qué pieza
   puede ir después de cuál, escribe la cuenta como en el cuaderno y avisa
   cuando algo no encaja. No juega nada: eso es del motor.
   ══════════════════════════════════════════════════════════════════════ */
(function (raiz) {
'use strict';
const P = raiz.Palestra;
const SUP = {2: '²', 3: '³'};

/* ── dibujos de las teclas ── */
const CALAVERA =
  '<svg viewBox="0 0 16 16" aria-hidden="true">' +
    '<path fill="#2b0a22" d="M8 2.1c-3.1 0-5.2 2.1-5.2 4.9 0 1.6.7 2.8 1.7 3.5v1.3' +
      'c0 .7.6 1.3 1.3 1.3h4.4c.7 0 1.3-.6 1.3-1.3v-1.3c1-.7 1.7-1.9 1.7-3.5' +
      'c0-2.8-2.1-4.9-5.2-4.9z"/>' +
    '<circle fill="#fff" cx="5.9" cy="6.7" r="1.6"/><circle fill="#fff" cx="10.1" cy="6.7" r="1.6"/>' +
    '<path fill="#fff" d="M8 8.6l.85 1.5h-1.7z"/>' +
    '<rect fill="#fff" x="6.15" y="10.9" width="1.1" height="2.2" rx=".4"/>' +
    '<rect fill="#fff" x="8.75" y="10.9" width="1.1" height="2.2" rx=".4"/>' +
  '</svg>';
function frascoHtml(po){
  return '<span class="frasco">' +
      '<span class="corcho"></span><span class="cuello"></span>' +
      '<span class="asa i"></span><span class="asa d"></span>' +
      '<span class="vidrio"><span class="liquido"></span></span>' +
      (po.k < 0 ? '<span class="calavera">' + CALAVERA + '</span>' : '') +
    '</span>';
}
const clasePoc = po => 'pocion ' + (po.k < 0 ? 'bando' : (Math.abs(po.k) > 1 ? 'crece' : 'mengua')) +
  (Math.abs(po.k) < 1 ? ' mengua' : '');
function miniTirador(f){
  const c = f < 0 ? 'var(--izq)' : 'var(--der)', s = f < 0 ? 1 : -1;
  return '<svg viewBox="0 0 26 26" aria-hidden="true">' +
    '<path d="M' + (13 + 11 * s) + ' 15 H' + (13 - 12 * s) + '" stroke="#8a7442" stroke-width="2.2" stroke-linecap="round"/>' +
    '<circle cx="' + (13 + 3 * s) + '" cy="6" r="4.4" fill="' + c + '" stroke="#241C36" stroke-width="1"/>' +
    '<path d="M' + (13 + 4 * s) + ' 10.5 L' + (13 - 1 * s) + ' 18.5" stroke="' + c + '" stroke-width="5.5" stroke-linecap="round"/>' +
    '<path d="M' + (13 - 1 * s) + ' 18.5 L' + (13 - 5 * s) + ' 24 M' + (13 - 1 * s) + ' 18.5 L' + (13 + 3 * s) + ' 24"' +
    ' stroke="' + c + '" stroke-width="2.6" stroke-linecap="round"/></svg>';
}

/* ── la cuenta escrita, pieza a pieza; «clase(i)» marca las que se iluminan ── */
const numHtml = (f, primero) => '<span class="' + (f < 0 ? 'izq' : 'der') + '">' + P.numCuaderno(f, primero) + '</span>';
function htmlCuenta(tok, clase){
  let h = '', primero = true, abierta = '';
  tok.forEach((t, i) => {
    const sig = tok[i + 1];
    let x = '';
    /* un negativo elevado va siempre entre paréntesis: (−2)² no es −2² */
    if(t.t === 'n'){ x = numHtml(t.f, primero && !(sig && sig.t === 'e' && t.f < 0)); primero = false; }
    else if(t.t === 'e') x = '<sup class="tl-exp">' + t.n + '</sup>';
    else if(t.t === '+'){ x = '<span class="op"> + </span>'; primero = false; }
    else if(t.t === '-'){ x = '<span class="op">' + (primero ? '−' : ' − ') + '</span>'; primero = false; }
    else if(t.t === '('){ x = '<span class="op">(</span>'; primero = true; }
    else if(t.t === ')') x = '<span class="op">)</span>';
    else if(t.t === 'p'){ x = '<span class="poc">' + (t.pre ? P.preTxt(t.k) : P.etqDe(t.k)) + '</span>'; primero = false; }
    /* las piezas seguidas con la misma marca van en un solo recuadro */
    const c = clase ? clase(i) : '';
    if(c !== abierta){ if(abierta) h += '</span>'; if(c) h += '<span class="' + c + '">'; abierta = c; }
    h += x;
  });
  if(abierta) h += '</span>';
  return h;
}

/* ── qué pasa al pulsar una tecla: devuelve la cuenta nueva y, si algo no
   encaja, el aviso. Es una función pura: no toca la pantalla ── */
const esFactor = t => t && (t.t === 'n' || t.t === ')' || t.t === 'e' || (t.t === 'p' && !t.pre));
function pulsa(tok, tk){
  const T = tok.slice(), ult = T[T.length - 1];
  const abiertos = T.filter(t => t.t === '(').length - T.filter(t => t.t === ')').length;
  const no = aviso => ({tok, aviso});
  if(tk.t === 'n'){
    if(esFactor(ult)) T.push({t: '+'});          // dos tiradores seguidos: se suman
    T.push({t: 'n', f: tk.f});
  }else if(tk.t === '+' || tk.t === '-'){
    if(!ult || ult.t === '('){
      if(tk.t === '-') T.push({t: '-'});          // un menos delante del todo: vale
    }else if(ult.t === '+' || ult.t === '-') T[T.length - 1] = {t: tk.t};
    else if(ult.t === 'p' && ult.pre)
      return no('Después de <b>' + P.preTxt(ult.k) + '</b> tiene que venir a quién se lo das: un tirador o un paréntesis.');
    else T.push({t: tk.t});
  }else if(tk.t === '('){
    if(esFactor(ult)) T.push({t: '+'});
    T.push({t: '('});
  }else if(tk.t === ')'){
    if(abiertos <= 0) return no('No hay ningún paréntesis abierto que cerrar.');
    if(!esFactor(ult)) return no('Antes de cerrar, termina lo de dentro.');
    T.push({t: ')'});
  }else if(tk.t === 'p'){
    const po = P.pocionDe(tk.k);
    if(!po) return no('');
    if(esFactor(ult)) T.push({t: 'p', k: po.k, pre: false});
    else if(Number.isInteger(po.k)) T.push({t: 'p', k: po.k, pre: true});
    else return no('Un frasco de repartir no se puede poner <b>delante</b>: <b>2 : (…)</b> no es lo mismo que <b>(…) : 2</b>. Escribe primero a quién se reparte y luego el frasco.');
  }else if(tk.t === 'e'){
    if(!ult || (ult.t !== 'n' && ult.t !== ')'))
      return no('El <b>' + SUP[tk.n] + '</b> va pegado a un tirador o a un paréntesis: <b>(−2)²</b> o <b>(1 − 3)²</b>.');
    T.push({t: 'e', n: tk.n});
  }else if(tk.t === 'borra'){
    T.pop();
  }
  return {tok: T, aviso: ''};
}

/* ── montar las teclas dentro de un elemento. «al» recibe cada tecla pulsada ── */
function monta(el, al){
  const fila = cls => { const d = document.createElement('div'); d.className = 'tl-fila ' + cls; el.appendChild(d); return d; };
  const tecla = (fil, html, cls, etq, tk) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = cls; b.innerHTML = html;
    b.setAttribute('aria-label', etq); b.title = etq;
    b.addEventListener('click', () => al(tk));
    fil.appendChild(b);
    return b;
  };
  const fi = fila('tl-tir');
  [-1, -2, -3, -4, -5].forEach(f => tecla(fi, miniTirador(f) + '<b>' + P.conSigno(f) + '</b>', 'tl-t izq', 'Tirador de ' + P.conSigno(f), {t: 'n', f}));
  const fd = fila('tl-tir');
  [1, 2, 3, 4, 5].forEach(f => tecla(fd, miniTirador(f) + '<b>' + P.conSigno(f) + '</b>', 'tl-t der', 'Tirador de ' + P.conSigno(f), {t: 'n', f}));
  const fp = fila('tl-poc');
  P.POCIONES.forEach(po => tecla(fp, frascoHtml(po) + '<span class="etq">' + po.e + '</span>', clasePoc(po) + ' tl-p', po.n + ', ' + po.e + ': ' + po.d, {t: 'p', k: po.k}));
  const fo = fila('tl-ops');
  tecla(fo, '+', 'tl-o', 'Más: que entre', {t: '+'});
  tecla(fo, '−', 'tl-o', 'Menos: que se retire', {t: '-'});
  tecla(fo, '(', 'tl-o', 'Abre paréntesis', {t: '('});
  tecla(fo, ')', 'tl-o', 'Cierra paréntesis', {t: ')'});
  tecla(fo, '²', 'tl-o', 'Al cuadrado', {t: 'e', n: 2});
  tecla(fo, '³', 'tl-o', 'Al cubo', {t: 'e', n: 3});
  tecla(fo, '⌫', 'tl-o', 'Borra lo último', {t: 'borra'});
  tecla(fo, '=', 'tl-o tl-igual', 'Igual: a jugar', {t: '='});
}

/* las teclas también desde el teclado del ordenador */
function teclaDeTeclado(ev){
  const m = {'+': {t: '+'}, '-': {t: '-'}, '(': {t: '('}, ')': {t: ')'}, 'Backspace': {t: 'borra'}, '=': {t: '='}, 'Enter': {t: '='}};
  if(m[ev.key]) return m[ev.key];
  if(/^[1-5]$/.test(ev.key)) return {t: 'n', f: ev.shiftKey || ev.altKey ? -Number(ev.key) : Number(ev.key)};
  return null;
}

raiz.Tablilla = {htmlCuenta, pulsa, monta, teclaDeTeclado, frascoHtml, clasePoc, miniTirador, CALAVERA};
})(window);

<script>
/* ══════════════════════════════════════════════════════════════════════
   LA PALESTRA · el reproductor
   Pasa los fotogramas de una película del motor. Enseña la foto k al
   instante (campo y banquillo) y, al avanzar, anima solo el paso que toca:
   el que llega, el que bebe, el que se retira, los que se juntan, el que
   sale a tirar. Al acabar cada paso, la foto siguiente manda: nada de lo
   que se ve sale de la animación, todo sale del motor.
   ══════════════════════════════════════════════════════════════════════ */
(function (raiz) {
'use strict';
const P = raiz.Palestra, C = raiz.Campo, T = raiz.Tirador, TL = raiz.Tablilla;

const REDUCIDO = raiz.matchMedia && raiz.matchMedia('(prefers-reduced-motion: reduce)').matches;
const espera = ms => new Promise(ok => setTimeout(ok, REDUCIDO ? 0 : ms));

/* ── el banquillo: los que se preparan y los frascos que esperan ── */
function pintaBanquillo(el, foto, k, pel, anim){
  anim = anim || {};
  const sitio = el.querySelector('.bq-sitio');
  sitio.innerHTML = foto.banquillo.map(q => {
    let c = 'bq tirador ' + (q.f < 0 ? 'izq' : 'der') + (q.venia ? ' venia-' + q.venia : '');
    if(anim.llega && anim.llega.indexOf(q.id) >= 0) c += ' llega';
    if(anim.trago === q.id) c += ' trago';
    if(anim.se && anim.se.indexOf(q.id) >= 0) c += ' se-va';
    if(anim.junta && anim.junta.indexOf(q.id) >= 0) c += ' junta';
    const po = anim.bebe === q.id ? P.pocionDe(anim.k) : null;
    return '<span class="' + c + '" data-bq="' + q.id + '">' + T.dibujaTirador(q, 13) +
      '<b class="bq-f">' + P.conSigno(q.f) + '</b>' +
      (po ? '<span class="bq-frasco pocion ' + TL.clasePoc(po).replace('pocion ', '') + '">' + TL.frascoHtml(po) + '</span>' : '') + '</span>';
  }).join('');
  /* los frascos de delante esperan aquí hasta que hay a quién dárselos */
  const usados = new Set();
  pel.pasos.slice(0, k).forEach(p => { if(p.tipo === 'bebe') p.m.forEach(i => usados.add(i)); });
  const esperan = pel.tok.map((t, i) => ({t, i})).filter(x => x.t.t === 'p' && x.t.pre && !usados.has(x.i));
  el.querySelector('.bq-banco').innerHTML = esperan.map(x => {
    const po = P.pocionDe(x.t.k);
    return '<span class="bq-espera pocion ' + TL.clasePoc(po).replace('pocion ', '') + (anim.baja === x.i ? ' baja' : '') + '" data-ti="' + x.i + '">' +
      TL.frascoHtml(po) + '<i>' + P.preTxt(x.t.k) + '</i></span>';
  }).join('');
  el.hidden = !pel.conBanquillo;
}

/* ── el reproductor ── */
function crea(o){
  const R = {pel: null, k: 0, jugando: false, tok: 0, repaso: 0, alcance: 8,
             pregunta: 0, dichos: {}, pin: null, pinPara: 0, veredicto: null};
  const campo = o.campo, banquillo = o.banquillo;
  const fotoDe = k => k ? R.pel.pasos[k - 1] : {cuerda: [], banquillo: [], bandera: 0, tipo: '', x: ''};
  const avisa = () => { if(o.alCambiar) o.alCambiar(R); };

  R.carga = function(pel){
    R.pel = pel; R.k = 0; R.jugando = false; R.tok++;
    R.pregunta = 0; R.dichos = {}; R.pin = null; R.pinPara = 0; R.veredicto = null;
    pel.conBanquillo = pel.pasos.some(p => p.banquillo.length) || pel.tok.some(t => t.t === 'p' && t.pre);
    R.alcance = Math.max(8, ...pel.pasos.map(p => Math.abs(p.bandera)));
    R.muestra(0);
  };
  /* la foto k, al instante */
  R.muestra = function(k, anim){
    if(!R.pel) return;
    R.k = Math.max(0, Math.min(R.pel.pasos.length, k));
    const foto = fotoDe(R.k);
    C.pinta(campo, foto, {alcance: R.alcance, nuevos: (anim && anim.nuevos) || [],
      viva: R.pregunta === R.k + 1, pin: R.pinPara === R.k || (R.jugando && R.pinPara === R.k + 1) ? R.pin : null});
    pintaBanquillo(banquillo, foto, R.k, R.pel, anim);
    avisa();
  };
  /* el paso k+1, animado */
  /* ▶: antes de un paso clave, primero la pregunta. Un segundo ▶ sin tocar la
     regla lo juega igual (para el profe en la pizarra) */
  R.avanza = async function(){
    if(!R.pel || R.jugando || R.k >= R.pel.pasos.length) return;
    const k = R.k, paso = R.pel.pasos[k];
    if(paso.clave && !(k in R.dichos) && !R.pregunta && !o.sinPreguntas){
      R.pregunta = k + 1;
      R.muestra(k);
      return;
    }
    R.pregunta = 0;
    /* el pronóstico solo vale la primera vez que se juega ese paso */
    if(!R.pendiente){ R.pin = null; R.pinPara = 0; }
    R.pendiente = false;
    R.veredicto = null;
    const tok = ++R.tok, vivo = () => R.tok === tok;
    R.jugando = true; avisa();
    const antes = fotoDe(k);
    const enBanco = id => antes.banquillo.some(q => q.id === id) || paso.banquillo.some(q => q.id === id);
    const idsNuevos = paso.cuerda.filter(q => !antes.cuerda.some(a => a.id === q.id)).map(q => q.id);
    const idsBqNuevos = paso.banquillo.filter(q => !antes.banquillo.some(a => a.id === q.id)).map(q => q.id);
    const idsIdos = antes.cuerda.filter(q => !paso.cuerda.some(a => a.id === q.id)).map(q => q.id);
    const idsBqIdos = antes.banquillo.filter(q => !paso.banquillo.some(a => a.id === q.id)).map(q => q.id);
    try{
      if(paso.tipo === 'bebe'){
        /* bebe el del banquillo cuya fuerza cambia entre una foto y la otra */
        const cambia = antes.banquillo.find(q => { const n = paso.banquillo.find(x => x.id === q.id); return n && n.f !== q.f; });
        const id = (cambia || antes.banquillo[0] || {}).id;
        /* el frasco que baja del banco, si venía de delante */
        const ti = paso.m.find(i => R.pel.tok[i] && R.pel.tok[i].t === 'p' && R.pel.tok[i].pre);
        const k0 = kDe(paso);
        pintaBanquillo(banquillo, antes, k, R.pel, {baja: ti});
        await espera(ti !== undefined ? 500 : 0); if(!vivo()) return;
        pintaBanquillo(banquillo, antes, k, R.pel, {bebe: id, k: k0});
        await espera(1000); if(!vivo()) return;
        C.pinta(campo, paso, {alcance: R.alcance});
        pintaBanquillo(banquillo, paso, k + 1, R.pel, {trago: id});
        await espera(700);
      }else if(paso.tipo === 'junta'){
        pintaBanquillo(banquillo, antes, k, R.pel, {junta: idsBqIdos});
        await espera(900); if(!vivo()) return;
        R.muestra(k + 1, {llega: idsBqNuevos});
        await espera(500);
      }else if(paso.tipo === 'sale'){
        pintaBanquillo(banquillo, antes, k, R.pel, {se: idsBqIdos});
        await espera(450); if(!vivo()) return;
        R.muestra(k + 1, {nuevos: idsNuevos});
        tiron(campo);
        await espera(1000);
      }else if(paso.tipo === 'retira'){
        if(idsIdos.length){
          /* en la cuerda, retirarse es cosa de Zeus: se asoma, rayo, y humo */
          const id = idsIdos[0], nodo = campo.querySelector('.tirador[data-id="' + id + '"]');
          const q = antes.cuerda.find(x => x.id === id) || {f: 1};
          if(raiz.Zeus && nodo) await raiz.Zeus.fulmina(campo, nodo, q.f, espera);
          else await espera(500);
          if(!vivo()) return;
          R.muestra(k + 1);
          tiron(campo);
          await espera(1000);
        }else{
          pintaBanquillo(banquillo, antes, k, R.pel, {se: idsBqIdos});
          await espera(450); if(!vivo()) return;
          R.muestra(k + 1);
          await espera(300);
        }
      }else{ /* entra, pareja */
        R.muestra(k + 1, {nuevos: idsNuevos, llega: idsBqNuevos});
        if(idsNuevos.length && paso.bandera !== antes.bandera) tiron(campo);
        await espera(idsNuevos.length ? 1000 : 700);
      }
    }finally{
      if(vivo()){
        R.jugando = false;
        /* el veredicto del pronóstico, si lo hubo */
        if(R.pinPara === k + 1 && R.pin !== null)
          R.veredicto = {dicho: R.pin, real: paso.bandera, clavado: R.pin === paso.bandera};
        R.muestra(k + 1);
      }
    }
  };
  /* el alumno toca la regla: se apunta lo que dijo y se juega el paso */
  R.elige = function(v){
    if(!R.pregunta || R.jugando) return;
    const k = R.pregunta - 1;
    R.dichos[k] = v; R.pin = v; R.pinPara = k + 1; R.pendiente = true;
    R.pregunta = 0;
    R.avanza();
  };
  R.retrocede = function(){ R.repaso++; R.pregunta = 0; R.veredicto = null; if(!R.jugando && R.k > 0) R.muestra(R.k - 1); };
  R.principio = function(){ R.repaso++; R.pregunta = 0; R.veredicto = null; if(!R.jugando) R.muestra(0); };
  /* ▶▶: la película de un tirón; se para en cuanto se toca otro botón */
  R.repasa = async function(){
    if(!R.pel || R.jugando) return;
    R.pregunta = 0; R.muestra(0);
    const yo = ++R.repaso;
    o.sinPreguntas = true;
    try{
      while(R.k < R.pel.pasos.length && R.repaso === yo){
        await espera(350); if(R.repaso !== yo) return;
        await R.avanza();
      }
    }finally{ o.sinPreguntas = false; }
  };
  R.para = function(){ R.tok++; R.repaso++; R.jugando = false; R.pregunta = 0; };
  return R;
}

/* qué factor lleva un paso de beber: se lee de la cuenta pequeña «(−4)·(−2) = +8» */
function kDe(paso){
  const m = /\)\s*(·|:)\s*\(?([−+-]?\d+)\)?\s*=/.exec(paso.x || '');
  if(!m) return -1;
  const v = Number(m[2].replace('−', '-'));
  return m[1] === ':' ? 1 / v : v;
}
function tiron(campo){
  campo.classList.remove('tiron'); void campo.offsetWidth; campo.classList.add('tiron');
  setTimeout(() => campo.classList.remove('tiron'), 620);

const DIBUJA = {jef: jeferion, lis: listillon};
function ponCara(c, quien, pose, hablar){

function poseDeTexto(h){

const ZV = {piel:'#E7B58C', sombra:'#C98E66', barba:'#F4F1EA', barbaS:'#CFCBD8', toga:'#EEF0F6', togaS:'#C9CEDF',

}
function zeus(pose){
  pose = pose || 'habla';
  const P = {
    habla:   {bI:[110,14,70,12], bD:[-50,15,-95,12], rayo:'mano', boca:.5, ceja:'serio', ojo:'abierto'},
    enfada:  {bI:[110,14,70,12], bD:[-80,15,-100,14], rayo:'alto', boca:.7, ceja:'furia', ojo:'abierto'},
    rie:     {bI:[140,10,40,14], bD:[40,12,150,12], rayo:'suelo', boca:1, ceja:'alegre', ojo:'cerrado'},
    piensa:  {bI:[110,14,70,12], bD:[200,14,240,12], rayo:'suelo', boca:0, ceja:'piensa', ojo:'arriba'},

  /* brazo de delante, con el rayo si lo lleva */
  const [hx, hy] = fin(68, 64, P.bD);
  if(P.rayo === 'alto') s += rayoZ(hx, hy - 12, 1.05, 12);

<script>
/* ══════════════════════════════════════════════════════════════════════
   LA PALESTRA · Zeus y el rayo
   Cuando alguien se retira de la cuerda, Zeus se asoma por arriba, lanza
   el rayo y el tirador se va entre humo. Todo son efectos sobre el campo:
   no cambian el estado, que ya viene decidido por el motor.
   ══════════════════════════════════════════════════════════════════════ */
(function (raiz) {
'use strict';
const REDUCIDO = raiz.matchMedia && raiz.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rect = el => el.getBoundingClientRect();
const varaDe = f => Math.max(0, Math.min(1, Math.log(Math.max(1, Math.abs(f))) / Math.log(12)));

/* Zeus se asoma encima del tirador (a un lado, para no taparlo) */
function asoma(campo, elT){
  const rc = rect(campo), rn = rect(elT);
  const cxV = rn.left + rn.width / 2 - rc.left;
  let cx = cxV - 72, zurdo = false;
  if(cx < 66){ cx = Math.min(rc.width - 66, cxV + 72); zurdo = true; }
  let z = campo.querySelector('.zeus');
  if(!z){
    z = document.createElement('div');
    z.className = 'zeus';
    z.innerHTML = raiz.Personajes.ZEUS_SVG;
    campo.appendChild(z);
  }
  z.classList.remove('disipa', 'sinCetro', 'resplandece', 'lanza');
  z.classList.toggle('zurdo', zurdo);
  z.style.left = cx.toFixed(0) + 'px';
  z.style.setProperty('--asomo', '-12px');
  requestAnimationFrame(() => z.classList.add('fuera'));
  return z;
}
function lanza(z){
  z.classList.add('lanza', 'resplandece');
  setTimeout(() => z.classList.remove('lanza'), 240);
}
function seVa(z){

}
function trueno(campo, fza){
  campo.style.setProperty('--sac', (.55 + 1.15 * varaDe(fza)).toFixed(2));
  campo.classList.remove('trueno'); void campo.offsetWidth; campo.classList.add('trueno');
  setTimeout(() => campo.classList.remove('trueno'), 380);
}
function chamusca(campo, elT, fza){

  m.style.bottom = Math.max(8, Math.round(rc.bottom - rn.bottom + 2)) + 'px';

    d += ' L' + (sx + (cx - sx) * t + dx).toFixed(0) + ' ' + (sy + (cy - sy) * t).toFixed(0);

  svg.style.setProperty('--gn', (1.4 + 2.4 * u).toFixed(1));
  svg.style.setProperty('--bh', (1.3 + 2.4 * u).toFixed(1) + 'px');
  svg.style.setProperty('--ah', (.42 + .3 * u).toFixed(2));
  svg.setAttribute('width', String(Math.round(rc.width)));
  svg.setAttribute('height', String(Math.round(rc.height)));

  campo.appendChild(svg);
  setTimeout(() => svg.remove(), 700);

  fog.className = 'fogonazo';
  fog.style.setProperty('--af', (.28 + .42 * u).toFixed(2));
  campo.appendChild(fog);
  setTimeout(() => fog.remove(), 420);
}
function humo(campo, elT){
  const rc = rect(campo), rn = rect(elT);

function fulmina(campo, elT, fza, espera){

<script>
/* ══════════════════════════════════════════════════════════════════════
   LA PALESTRA · los ejercicios y la ruta
   Genera cuentas de cada nivel del andamiaje y las comprueba con el motor:
   una cuenta vale si tiene teatro (cabe en el campo, sin niveles de más)
   y da un entero. La ruta son las misiones, en orden, con su meta.
   Sin pantalla: la página decide cómo enseñarlo.
   ══════════════════════════════════════════════════════════════════════ */
(function (raiz) {
'use strict';
const P = raiz.Palestra;

const n = f => ({t: 'n', f}), MAS = {t: '+'}, MENOS = {t: '-'}, AB = {t: '('}, CI = {t: ')'};
const po = k => ({t: 'p', k, pre: false}), pre = k => ({t: 'p', k, pre: true}), e = x => ({t: 'e', n: x});

const MISIONES = [
  {t: 'Entra gente',        nivel: 0, meta: 4, d: 'Entrar es <b>sumar</b>, con su signo.'},
  {t: 'Alguien se retira',  nivel: 1, meta: 4, d: 'Retirarse es <b>restar</b>. Si no está, entra su pareja.'},
  {t: 'Pociones',           nivel: 2, meta: 4, d: 'El frasco se bebe en el <b>banquillo</b>. Con calavera, cambia de bando.'},
  {t: 'El paréntesis',      nivel: 3, meta: 4, d: 'Primero se <b>reduce</b> el paréntesis; luego bebe.'},
  {t: 'Potencias',          nivel: 4, meta: 3, d: '<b>(−2)²</b> no es <b>−2²</b>.'},
  {t: 'Todo junto',         nivel: 5, meta: 5, d: 'De todo un poco.'}
];

/* el azar se puede sustituir en las pruebas */
let azar = Math.random;
const elige = lista => lista[Math.floor(azar() * lista.length)];
const fuerza = () => elige([1, 2, 3, 4, 5]);
const conSigno = () => elige([1, -1]) * fuerza();
const POC_ENTERAS = [2, 3, -1, -2, -3], POC_TODAS = [2, 3, 1/2, 1/3, -1, -2, -3, -1/2];

/* una cuenta al azar de cada nivel; puede no valer (se comprueba después) */
function plantilla(nivel){
  switch(nivel){
    case 0: return azar() < .5 ? [n(conSigno()), MAS, n(conSigno())] : [n(conSigno()), MAS, n(conSigno()), MAS, n(conSigno())];
    case 1: {
      const a = conSigno();
      /* la mitad de las veces se retira alguien que está; la otra mitad, pareja nula */
      if(azar() < .5) return [n(a), MENOS, n(a)].length && [n(a), MAS, n(conSigno()), MENOS, n(a)];
      return azar() < .5 ? [n(a), MENOS, n(conSigno())] : [n(a), MAS, n(conSigno()), MENOS, n(conSigno())];
    }
    case 2: {
      const k = elige(POC_TODAS), a = conSigno(), b = conSigno();
      return elige([
        [n(a), MAS, n(b), po(k)],
        [n(a), MENOS, n(b), po(k)],
        [n(b), po(k), MAS, n(a)],
        Number.isInteger(k) ? [n(a), MAS, pre(k), n(b)] : [n(a), MAS, n(b), po(k)]
      ]);
    }
    case 3: {
      const k = elige(POC_ENTERAS), a = conSigno(), b = conSigno(), c = conSigno();
      return elige([
        [n(a), MAS, pre(k), AB, n(b), MAS, n(c), CI],
        [n(a), MENOS, AB, n(b), MAS, n(c), CI],
        [n(a), MENOS, AB, n(b), MENOS, n(c), CI],
        [AB, n(b), MAS, n(c), CI, po(k)],
        [pre(k), AB, n(b), MAS, n(c), CI, MAS, n(a)]
      ]);
    }
    case 4: {
      const a = conSigno(), b = elige([1, 2, 3]);
      return elige([
        [n(a), MAS, n(-b), e(2)],
        [MENOS, n(b), e(2)],
        [n(-b), e(3)],
        [n(a), MENOS, n(-b), e(2)],
        [n(-b), e(2), MAS, n(a)]
      ]);
    }
    default: return plantilla(1 + Math.floor(azar() * 4));
  }
}

/* una cuenta del nivel que vale: con teatro y resultado entero */
function genera(nivel){
  for(let i = 0; i < 60; i++){
    const tok = plantilla(nivel);
    let pel;
    try{ pel = P.graba(tok); }catch(err){ continue; }
    if(pel.sinTeatro || pel.valor === null) continue;
    if(pel.pasos.length < 2) continue;
    return {tok, valor: pel.valor, pel};
  }
  /* si el azar se empeña, una segura */
  const tok = [n(2), MAS, n(-3)];
  return {tok, valor: -1, pel: P.graba(tok)};
}

/* ── la ruta: dónde va el alumno ── */
function nuevaRuta(){ return {i: 0, hechas: 0, hecho: false, tropezo: false}; }
/* un acierto: devuelve si con este se cumple la misión */
function acierta(ruta){
  const m = MISIONES[ruta.i];
  if(ruta.hechas < m.meta) ruta.hechas++;
  if(ruta.hechas >= m.meta && !ruta.hecho){ ruta.hecho = true; return true; }
  return false;
}
function siguiente(ruta){
  if(ruta.i >= MISIONES.length - 1) return false;
  ruta.i++; ruta.hechas = 0; ruta.hecho = false; ruta.tropezo = false;
  return true;
}

/* ── el acta de la jornada ── */
function nuevaSesion(){ return {t0: Date.now(), bien: 0, mal: 0, mision: {}}; }
function anota(sesion, ruta, ok){
  sesion[ok ? 'bien' : 'mal']++;
  const m = sesion.mision[ruta.i] || (sesion.mision[ruta.i] = {bien: 0, mal: 0});
  m[ok ? 'bien' : 'mal']++;
}
function reloj(ms){
  const s = Math.max(0, Math.round(ms / 1000));
  return Math.floor(s / 60) + ' min ' + String(s % 60).padStart(2, '0') + ' s';
}
function actaEnTexto(sesion, ahora){
  ahora = ahora || Date.now();
  const total = sesion.bien + sesion.mal, f = new Date(ahora), dos = x => String(x).padStart(2, '0');
  let t = 'LA PALESTRA · acta de la jornada\n';
  t += 'Nombre: ' + (sesion.nombre || '(sin nombre)') + '\n';
  t += 'Fecha: ' + dos(f.getDate()) + '/' + dos(f.getMonth() + 1) + '/' + f.getFullYear() + '  ' + dos(f.getHours()) + ':' + dos(f.getMinutes()) + '\n';
  t += 'Tiempo: ' + reloj(ahora - sesion.t0) + '\n';
  t += 'Resueltas: ' + sesion.bien + '   Falladas: ' + sesion.mal + '   Acierto: ' + (total ? Math.round(100 * sesion.bien / total) : 0) + '%\n';
  t += 'Por misión:\n';
  const claves = Object.keys(sesion.mision).sort((a, b) => a - b);
  if(!claves.length) t += '  (ninguna anotada)\n';
  claves.forEach(i => {
    const m = sesion.mision[i];
    t += '  ' + (Number(i) + 1) + '. ' + MISIONES[i].t + ' — ' + m.bien + ' de ' + (m.bien + m.mal) + (m.mal > m.bien ? '  (floja)' : '') + '\n';
  });
  return t;
}

/* ── el turno guardado: se retoma al recargar, dentro de la misma clase ── */
const GUARDADO = 'palestra.turno.v1', CADUCA = 90 * 60 * 1000;
function guarda(ruta, sesion, alm){
  try{ (alm || raiz.localStorage).setItem(GUARDADO, JSON.stringify({v: 1, ts: Date.now(), ruta, sesion})); }catch(err){}
}
function lee(alm, ahora){
  try{
    const d = JSON.parse((alm || raiz.localStorage).getItem(GUARDADO) || 'null');
    if(!d || d.v !== 1 || !d.ruta || !d.sesion) return null;
    if((ahora || Date.now()) - d.sesion.t0 > CADUCA){ borra(alm); return null; }
    if(d.ruta.i < 0 || d.ruta.i >= MISIONES.length) return null;
    return d;
  }catch(err){ return null; }
}
function borra(alm){ try{ (alm || raiz.localStorage).removeItem(GUARDADO); }catch(err){} }

const E = {MISIONES, genera, plantilla, nuevaRuta, acierta, siguiente, nuevaSesion, anota, reloj, actaEnTexto,
  guarda, lee, borra, conAzar: f => { azar = f; }};
if(typeof module !== 'undefined' && module.exports) module.exports = E;
else raiz.Ejercicios = E;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

/* monta la entrevista en su sección; o.alPrueba(tok) abre una cuenta en la tablilla */
function monta(el, o){
  const DIBUJA = raiz.Personajes.DIBUJA;
  const $ = c => el.querySelector(c);
  const ev = {quien: 'zeus', hechas: new Set(), tok: 0};
  const quien = $('.ev-quien');
  [['zeus', 'Zeus'], ['jef', 'Jeferión'], ['lis', 'Listillón']].forEach(([id, nom]) => {
    const b = document.createElement('button');
    b.dataset.q = id; b.type = 'button';
    b.innerHTML = '<span class="ev-mini">' + DIBUJA[id]('calla') + '</span>' + nom;
    b.addEventListener('click', () => elige(id));
    quien.appendChild(b);
  });
  function elige(q){
    ev.quien = q; ev.hechas = new Set();
    quien.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.q === q)));
    const E = ENTREVISTAS[q];
    $('.ev-cartel').innerHTML = 'Hoy entrevistamos a <b>' + E.nombre + '</b>, ' + E.cargo + '.';
    $('.ev-pregunta').textContent = '';
    contesta(E.hola[0], E.hola[1]);
    pintaPreguntas();
  }
  function pintaPreguntas(){
    const E = ENTREVISTAS[ev.quien], L = $('.ev-lista');
    L.innerHTML = '';
    E.preguntas.filter(q => !q.tras || ev.hechas.has(q.tras)).forEach(q => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'ev-p' + (ev.hechas.has(q.id) ? ' hecha' : '') + (q.tras ? ' repregunta' : '');
      b.innerHTML = (q.tras ? '<span class="ev-re">repregunta</span> ' : '') + q.p;
      b.addEventListener('click', () => pregunta(q));
      L.appendChild(b);
    });
  }
  function pregunta(q){
    ev.hechas.add(q.id);
    $('.ev-pregunta').innerHTML = '— ' + q.p;
    const esc = $('.ev-escena');       // en el móvil, que se vea quién contesta
    if(esc.getBoundingClientRect().top < 0) esc.scrollIntoView({behavior: 'smooth', block: 'start'});
    contesta(q.pose, q.r, q.prueba);
    pintaPreguntas();
  }
  /* la respuesta sale letra a letra, con la boca moviéndose; al acabar, la postura */
  function contesta(pose, html, prueba){
    const tok = ++ev.tok;
    const cara = $('.ev-cara'), dibu = DIBUJA[ev.quien], txt = $('.ev-respuesta'), bp = $('.ev-prueba');
    bp.hidden = true;
    const trozos = html.split(/(<[^>]+>)/).filter(Boolean);
    const total = trozos.reduce((n, t) => n + (t[0] === '<' ? 0 : t.length), 0);
    const cierre = () => {
      if(ev.tok !== tok) return;
      txt.innerHTML = html;
      cara.innerHTML = dibu(pose);
      if(prueba && o && o.alPrueba){
        bp.hidden = false;
        bp.onclick = () => o.alPrueba(prueba.map(t => Object.assign({}, t, t.t === 'p' ? {pre: true} : {})));
      }
    };
    if(REDUCIDO){ cierre(); return; }
    let n = 0;
    const paso = () => {
      if(ev.tok !== tok) return;
      n = Math.min(total, n + 2);
      let quedan = n, h = '';
      for(const t of trozos){
        if(t[0] === '<'){ h += t; continue; }
        if(quedan <= 0) break;
        h += t.slice(0, quedan); quedan -= t.length;
      }
      txt.innerHTML = h;
      cara.innerHTML = dibu(Math.floor(n / 6) % 2 ? 'calla' : (pose === 'calla' ? 'calla' : HABLAN[ev.quien]));
      if(n < total) setTimeout(paso, 28); else cierre();
    };
    paso();
  }
  return {elige, abre: () => elige(ev.quien), calla: () => { ev.tok++; }};
}

<script>
  const P = window.Palestra, C = window.Campo, TL = window.Tablilla, PJ = window.Personajes, E = window.Ejercicios;
  const $ = id => document.getElementById(id);
  const n = f => ({t:'n', f}), mas = {t:'+'}, menos = {t:'-'}, ab = {t:'('}, ci = {t:')'};
  const po = k => ({t:'p', k, pre:false}), pre = k => ({t:'p', k, pre:true}), e = x => ({t:'e', n:x});
  const MUESTRAS = [
    [n(-2), mas, n(5)], [n(2), menos, n(5)], [n(2), mas, n(4), po(-2)], [n(3), menos, n(-4), po(-2)],
    [n(-2), mas, pre(3), ab, n(-2), mas, n(1), ci], [pre(-1), ab, n(-2), mas, n(-3), mas, n(-1), ci],
    [n(4), menos, ab, n(3), menos, n(5), ci], [n(-3), e(2)], [n(5), mas, n(4), menos, n(3), menos, n(-1), menos, n(-2)]
  ];
  let muestra = 0;

  /* ── el estado de la página: la cuenta escrita y, si se ha pulsado =, su película ── */
  const S = {tok: [], pel: null, visto: false, ej: null};
  /* la ruta y el acta; si hay un turno guardado de esta clase, se retoma */
  let ruta = E.nuevaRuta(), sesion = E.nuevaSesion();
  { const d = E.lee(); if(d){ ruta = d.ruta; sesion = d.sesion; } }

  const campo = C.monta($('campo'));
  const R = window.Reproductor.crea({campo, banquillo: $('banquillo'), alCambiar: pintaMandos});
  C.alTocarRegla(campo, v => R.elige(v));
  TL.monta($('tlTeclas'), tecla);

  function tecla(tk){
    if(S.ej) return;                         // en los ejercicios no se escribe
    if(tk.t === '='){ igual(); return; }
    const r = TL.pulsa(S.tok, tk);
    S.tok = r.tok; S.pel = null; S.visto = false; R.para();
    $('tlAviso').innerHTML = r.aviso;
    pintaTablilla();
    $('panelCampo').hidden = true;
  }
  function igual(){
    if(!S.tok.length){ $('tlAviso').innerHTML = 'Todavía no has escrito nada.'; return; }
    try{ S.pel = P.graba(S.tok); }
    catch(err){ $('tlAviso').innerHTML = err.message; return; }
    S.visto = false;
    if(S.ej && S.ej.fase !== 'bien') S.ej.visto = true;
    if(S.pel.sinTeatro){
      $('tlAviso').innerHTML = S.pel.sinTeatro + ' Así que esta va <b>sin teatro</b>: te la calculo igual.';
      $('panelCampo').hidden = true;
    }else{
      $('tlAviso').innerHTML = 'Pulsa <b>▶</b> para verla en el campo, paso a paso.';
      $('panelCampo').hidden = false;
      $('panelCampo').scrollIntoView({behavior: 'smooth', block: 'start'});
    }
    pintaTablilla();
    if(!S.pel.sinTeatro) R.carga(S.pel);
  }

  /* ── LA RUTA Y LOS EJERCICIOS ── */
  function pintaRuta(){
    const m = E.MISIONES[ruta.i];
    $('rtCab').textContent = 'Misión ' + (ruta.i + 1) + ' de ' + E.MISIONES.length;
    $('rtTitulo').textContent = m.t;
    $('rtTxt').innerHTML = (ruta.hecho ? '<b>Misión cumplida.</b> ' : '') + m.d;
    let p = '';
    for(let k = 0; k < m.meta; k++) p += '<span class="rt-p' + (k < ruta.hechas ? ' hecho' : '') + '"></span>';
    $('rtPuntos').innerHTML = p + '<span class="rt-hito">' + ruta.hechas + ' de ' + m.meta + '</span>';
    $('rtSigue').hidden = !(ruta.hecho && ruta.i < E.MISIONES.length - 1);
    $('rtSalta').hidden = ruta.hecho || ruta.i >= E.MISIONES.length - 1;
  }
  function ronda(){
    const m = E.MISIONES[ruta.i];
    const ej = E.genera(m.nivel);
    S.ej = {valor: ej.valor, visto: false, fase: 'pensando'};
    S.tok = ej.tok; S.pel = null; S.visto = false; R.para();
    $('tlResp').value = '';
    $('tlAviso').innerHTML = '';
    $('panelCampo').hidden = true;
    pintaTablilla(); pintaMarca();
  }
  function pintaMarca(){
    const m = sesion.mision[ruta.i] || {bien: 0, mal: 0};
    $('tlMarca').innerHTML = '<span class="fi">resueltas <b>' + m.bien + '</b></span>' +
      '<span class="fi">sin mirar <b>' + (sesion.solas && sesion.solas[ruta.i] || 0) + '</b></span>';
  }
  const esEntero = t => /^[-+]?\d+$/.test(String(t).replace(/[−–]/g, '-').replace(/\s+/g, ''));
  function comprueba(){
    if(!S.ej || S.ej.fase === 'bien') return;
    const resp = String($('tlResp').value).trim();
    if(!resp) return;
    if(!esEntero(resp)){ $('tlAviso').innerHTML = 'Escribe un número: con cifras, y el signo delante si lo lleva.'; return; }
    const dicho = parseInt(resp.replace(/[−–]/g, '-'), 10);
    if(dicho === S.ej.valor){
      S.ej.fase = 'bien';
      E.anota(sesion, ruta, true);
      if(!S.ej.visto){ sesion.solas = sesion.solas || {}; sesion.solas[ruta.i] = (sesion.solas[ruta.i] || 0) + 1; }
      const cumplida = E.acierta(ruta);
      $('tlAviso').innerHTML = '<b>¡Correcto!</b>' + (S.ej.visto ? '' : ' Y sin mirar.') + (cumplida ? ' <b>Misión cumplida.</b>' : '');
      E.guarda(ruta, sesion);
      pintaRuta(); pintaMarca(); pintaActa();
      const yo = S.ej;
      setTimeout(() => { if(S.ej === yo) ronda(); }, 2000);
    }else{
      E.anota(sesion, ruta, false);
      E.guarda(ruta, sesion);
      $('tlAviso').innerHTML = 'No es <b>' + resp.replace('-', '−') + '</b>. Pulsa <b>▶ Verlo en el campo</b> y mira dónde acaba.';
      $('tlResp').value = '';
      pintaMarca(); pintaActa();
    }
  }
  function modoRuta(si){
    $('ruta').hidden = !si;
    $('tlEj').hidden = !si;
    $('tlTeclas').hidden = si;
    $('tlPie').hidden = si;
    $('tlRuta').hidden = false;
    if(si){ pintaRuta(); ronda(); }
    else{ S.ej = null; S.tok = []; S.pel = null; R.para(); $('tlAviso').innerHTML = 'Escribe una cuenta y pulsa <b>=</b>.'; pintaTablilla(); $('panelCampo').hidden = true; }
  }
  function pintaActa(){
    const total = sesion.bien + sesion.mal;
    $('acResumen').innerHTML = '<b>' + sesion.bien + '</b> resueltas · <b>' + sesion.mal + '</b> falladas · ' +
      (total ? Math.round(100 * sesion.bien / total) : 0) + '% de acierto · tiempo: <b>' + E.reloj(Date.now() - sesion.t0) + '</b>';
    $('acFilas').innerHTML = Object.keys(sesion.mision).sort((a, b) => a - b).map(i => {
      const m = sesion.mision[i], t = m.bien + m.mal;
      return '<div class="ac-f' + (m.mal > m.bien ? ' floja' : '') + '"><span class="ac-n">' + (Number(i) + 1) + '. ' + E.MISIONES[i].t + '</span><span>' + m.bien + ' de ' + t + '</span></div>';
    }).join('') || '<div class="ac-f"><span class="ac-n">Aún no hay nada anotado.</span></div>';
    $('acNombre').value = sesion.nombre || '';
  }
  $('tlComprueba').addEventListener('click', comprueba);
  $('tlResp').addEventListener('keydown', ev => { if(ev.key === 'Enter'){ ev.preventDefault(); comprueba(); } });
  $('tlVer').addEventListener('click', () => { if(S.ej) igual(); });
  $('rtSigue').addEventListener('click', () => { if(E.siguiente(ruta)){ E.guarda(ruta, sesion); pintaRuta(); ronda(); } });
  $('rtSalta').addEventListener('click', () => { if(E.siguiente(ruta)){ E.guarda(ruta, sesion); pintaRuta(); ronda(); } });
  $('rtLibre').addEventListener('click', () => modoRuta(false));
  $('tlRuta').addEventListener('click', () => modoRuta(true));
  $('acNombre').addEventListener('input', () => { sesion.nombre = $('acNombre').value; E.guarda(ruta, sesion); });
  $('acCopia').addEventListener('click', () => {
    const t = E.actaEnTexto(sesion);
    const listo = () => { $('acCopia').textContent = 'Copiada'; setTimeout(() => { $('acCopia').textContent = 'Copiar acta'; }, 1500); };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(listo, () => alert(t));
    else alert(t);
  });
  $('acta').addEventListener('toggle', pintaActa);
  function pintaTablilla(){
    let h = TL.htmlCuenta(S.tok);
    if(S.pel){
      const fin = S.pel.sinTeatro || (R.pel === S.pel && R.k === S.pel.pasos.length);
      if(fin) h += '<span class="op"> = </span><b class="tl-res' + (S.pel.exacto[1] !== 1 ? ' frac' : '') + '">' + P.fracTxt(S.pel.exacto) + '</b>';
    }
    $('tlEscrito').innerHTML = h || '<span class="tl-vacia">escribe aquí…</span>';
  }
  /* la cartela: la cuenta con el trozo que se juega iluminado, y debajo qué pasa */
  function cartela(R){
    const c = $('cartela'), pel = R.pel, k = R.k, n = pel.pasos.length;
    const hechos = new Set();
    pel.pasos.slice(0, Math.max(0, k - 1)).forEach(p => p.m.forEach(i => hechos.add(i)));
    let on = new Set(), x = '', clase = '';
    if(R.pregunta){
      on = new Set(pel.pasos[R.pregunta - 1].m);
      x = '¿dónde acabará? <b>toca la regla</b>'; clase = 'pregunta';
    }else if(k === 0){
      const esperan = pel.tok.some(t => t.t === 'p' && t.pre);
      x = esperan ? 'la poción espera en el banquillo' : 'pulsa ▶';
    }else{
      const paso = pel.pasos[k - 1];
      on = new Set(paso.m); x = paso.x;
      if(R.veredicto){
        const v = R.veredicto;
        x += (x ? '<br>' : '') + (v.clavado ? '<b class="clavado">¡clavado!</b>'
          : 'dijiste ' + P.conSigno(v.dicho) + ', acaba en <b>' + P.conSigno(v.real) + '</b>');
      }
    }
    const fin = k === n && !R.jugando;
    c.innerHTML = '<span class="ct-cuenta">' + TL.htmlCuenta(pel.tok, i => on.has(i) ? 'ct-on' : (hechos.has(i) && !fin ? 'ct-hecho' : '')) +
      (fin ? ' <span class="op">=</span> <b class="ct-res">' + P.fracTxt(pel.exacto) + '</b>' : '') + '</span>' +
      (x ? '<small class="ct-x ' + clase + '">' + x + '</small>' : '');
    c.hidden = false;
    c.classList.remove('nueva'); void c.offsetWidth; c.classList.add('nueva');
  }
  /* Jeferión comenta el veredicto y el final de la función */
  function jeferion(R){
    const k = R.k, n = R.pel.pasos.length;
    let h = '';
    if(R.veredicto){
      const v = R.veredicto;
      h = v.clavado ? '<b>¡Clavado!</b> Así se gana un pulso.'
        : 'Dijiste <b>' + P.conSigno(v.dicho) + '</b> y acaba en <b>' + P.conSigno(v.real) + '</b>. Mira hacia dónde tira cada uno.';
    }else if(k === n && !R.jugando) h = 'La cuenta vale <b>' + P.fracTxt(R.pel.exacto) + '</b>.';
    $('jefAviso').innerHTML = h;
  }
  /* los mandos, cada vez que el reproductor cambia */
  function pintaMandos(R){
    if(!R.pel) return;
    const k = R.k, foto = k ? R.pel.pasos[k - 1] : null;
    cartela(R);
    jeferion(R);
    $('pasoT').textContent = 'fotograma ' + k + ' de ' + R.pel.pasos.length;
    $('atras').disabled = k === 0 || R.jugando;
    $('sig').disabled = k >= R.pel.pasos.length || R.jugando;
    $('inicio').disabled = R.jugando;
    if(k === R.pel.pasos.length) S.visto = true;
    $('todo').hidden = !S.visto;
    $('todo').disabled = R.jugando;
    pintaTablilla();
  }
  $('sig').addEventListener('click', () => R.avanza());
  $('atras').addEventListener('click', () => R.retrocede());
  $('inicio').addEventListener('click', () => R.principio());
  $('todo').addEventListener('click', () => R.repasa());
  $('tlLimpia').addEventListener('click', () => { S.tok = []; S.pel = null; R.para(); $('tlAviso').innerHTML = 'Tablilla limpia.'; pintaTablilla(); $('panelCampo').hidden = true; });
  $('tlMuestra').addEventListener('click', () => { S.tok = MUESTRAS[muestra++ % MUESTRAS.length].slice(); S.pel = null; R.para(); $('tlAviso').innerHTML = ''; pintaTablilla(); $('panelCampo').hidden = true; });
  document.addEventListener('keydown', ev => {
    if(ev.target && /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)) return;
    if(S.pel && !S.pel.sinTeatro && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft')){
      ev.preventDefault(); if(ev.key === 'ArrowRight') R.avanza(); else R.retrocede(); return;
    }
    const tk = TL.teclaDeTeclado(ev);
    if(tk){ ev.preventDefault(); tecla(tk); }
  });
  window.addEventListener('resize', () => { if(R.pel && !R.jugando) R.muestra(R.k); });
  /* las caras: cada aviso nuevo pone la pose que le va y mueve el pico */
  document.querySelectorAll('.cara.jef').forEach(c => PJ.ponCara(c, 'jef', 'habla'));
  document.querySelectorAll('.cara.lis').forEach(c => PJ.ponCara(c, 'lis', 'habla'));
  document.querySelectorAll('.habla').forEach(h => {
    const av = h.querySelector('.aviso'), c = h.querySelector('.cara');
    const quien = c.classList.contains('jef') ? 'jef' : 'lis';
    new MutationObserver(() => { const p = PJ.poseDeTexto(av.innerHTML); if(p) PJ.ponCara(c, quien, p, true); })
      .observe(av, {childList: true, subtree: true, characterData: true});
  });
  /* ── LAS ENTREVISTAS ── */
  let enRuta = true;
  const EV = window.Entrevistas.monta($('entrevista'), {alPrueba: tok => {
    entrevista(false);
    modoRuta(false);
    S.tok = tok; pintaTablilla(); igual();
  }});
  function entrevista(si){
    $('entrevista').hidden = !si;
    document.querySelector('.tablilla').hidden = si;
    if(si){ enRuta = !$('ruta').hidden; $('ruta').hidden = true; $('panelCampo').hidden = true; $('acta').hidden = true; EV.abre(); window.scrollTo({top: 0, behavior: 'smooth'}); }
    else{ EV.calla(); $('acta').hidden = false; $('ruta').hidden = !enRuta; }
  }
  $('rtEntrevista').addEventListener('click', () => entrevista(true));
  $('tlEntrevista').addEventListener('click', () => entrevista(true));
  $('evSalir').addEventListener('click', () => entrevista(false));

  pintaTablilla();
  modoRuta(true);
  pintaActa();
</script>
</body>
</html>
